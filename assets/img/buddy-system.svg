<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Subnautica 2 Buddy System — two divers connected by proximity radio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06121f"/>
      <stop offset="1" stop-color="#0a2a3a"/>
    </linearGradient>
    <linearGradient id="diver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e4d5c"/>
      <stop offset="1" stop-color="#0a3340"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3de0c9" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3de0c9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- faint depth lines -->
  <g stroke="#123b4a" stroke-width="1" opacity="0.5">
    <path d="M0 90 Q 200 70 400 90 T 800 90" fill="none"/>
    <path d="M0 180 Q 200 160 400 180 T 800 180" fill="none"/>
    <path d="M0 320 Q 200 300 400 320 T 800 320" fill="none"/>
    <path d="M0 400 Q 200 385 400 400 T 800 400" fill="none"/>
  </g>

  <!-- bubbles -->
  <g fill="#2a7f92" opacity="0.55">
    <circle cx="120" cy="120" r="4"/>
    <circle cx="150" cy="90" r="3"/>
    <circle cx="660" cy="110" r="4"/>
    <circle cx="700" cy="150" r="3"/>
    <circle cx="400" cy="70" r="5"/>
  </g>

  <!-- center glow -->
  <circle cx="400" cy="215" r="150" fill="url(#glow)" opacity="0.35"/>

  <!-- radio waves between divers -->
  <g fill="none" stroke="#3de0c9" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <path d="M285 205 a 30 30 0 0 1 0 22"/>
    <path d="M265 190 a 55 55 0 0 1 0 52"/>
    <path d="M245 175 a 80 80 0 0 1 0 82"/>
    <path d="M515 205 a 30 30 0 0 0 0 22"/>
    <path d="M535 190 a 55 55 0 0 0 0 52"/>
    <path d="M555 175 a 80 80 0 0 0 0 82"/>
  </g>

  <!-- left diver -->
  <g transform="translate(190 150)">
    <ellipse cx="0" cy="150" rx="52" ry="18" fill="#0a2a3a" opacity="0.6"/>
    <circle cx="0" cy="30" r="26" fill="#123f4c" stroke="#3de0c9" stroke-width="2"/>
    <path d="M-18 24 a 22 22 0 0 1 36 0" fill="#0a2a3a"/>
    <circle cx="-9" cy="28" r="4" fill="#3de0c9"/>
    <circle cx="9" cy="28" r="4" fill="#3de0c9"/>
    <rect x="-20" y="56" width="40" height="58" rx="14" fill="url(#diver)" stroke="#14505e" stroke-width="2"/>
    <circle cx="0" cy="80" r="9" fill="#3de0c9" opacity="0.85"/>
    <path d="M-20 96 L-42 132 M20 96 L42 132" stroke="#0a3340" stroke-width="12" stroke-linecap="round"/>
    <path d="M-20 96 L-42 132 M20 96 L42 132" stroke="#14505e" stroke-width="8" stroke-linecap="round"/>
    <rect x="-34" y="126" width="24" height="10" rx="5" fill="#0a3340"/>
    <rect x="10" y="126" width="24" height="10" rx="5" fill="#0a3340"/>
    <!-- backpack -->
    <rect x="-16" y="58" width="10" height="40" rx="5" fill="#0a3340"/>
    <rect x="-26" y="62" width="8" height="14" rx="4" fill="#0c4a56"/>
    <rect x="-26" y="82" width="8" height="14" rx="4" fill="#0c4a56"/>
  </g>

  <!-- right diver -->
  <g transform="translate(610 150)">
    <ellipse cx="0" cy="150" rx="52" ry="18" fill="#0a2a3a" opacity="0.6"/>
    <circle cx="0" cy="30" r="26" fill="#123f4c" stroke="#3de0c9" stroke-width="2"/>
    <path d="M-18 24 a 22 22 0 0 1 36 0" fill="#0a2a3a"/>
    <circle cx="-9" cy="28" r="4" fill="#3de0c9"/>
    <circle cx="9" cy="28" r="4" fill="#3de0c9"/>
    <rect x="-20" y="56" width="40" height="58" rx="14" fill="url(#diver)" stroke="#14505e" stroke-width="2"/>
    <circle cx="0" cy="80" r="9" fill="#3de0c9" opacity="0.85"/>
    <path d="M-20 96 L-42 132 M20 96 L42 132" stroke="#0a3340" stroke-width="12" stroke-linecap="round"/>
    <path d="M-20 96 L-42 132 M20 96 L42 132" stroke="#14505e" stroke-width="8" stroke-linecap="round"/>
    <rect x="-34" y="126" width="24" height="10" rx="5" fill="#0a3340"/>
    <rect x="10" y="126" width="24" height="10" rx="5" fill="#0a3340"/>
    <rect x="6" y="58" width="10" height="40" rx="5" fill="#0a3340"/>
    <rect x="18" y="62" width="8" height="14" rx="4" fill="#0c4a56"/>
    <rect x="18" y="82" width="8" height="14" rx="4" fill="#0c4a56"/>
  </g>

  <!-- tracking tag marker floating -->
  <g transform="translate(400 330)">
    <circle r="26" fill="none" stroke="#3de0c9" stroke-width="2" opacity="0.7"/>
    <circle r="5" fill="#3de0c9"/>
  </g>
</svg>
