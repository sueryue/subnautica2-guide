<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Creatures — Subnautica 2 Guide</title>
  <meta name="description" content="The Subnautica 2 creature encyclopedia: passive fish, aggressive predators, and leviathans." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css?v=11" />
</head>
<body data-page="creatures">
  <header class="nav" id="siteHeader"></header>
  <section class="section">
    <div class="container">
      <div class="section-head">
        <span class="eyebrow">Creature Encyclopedia</span>
        <h2>Know what's in the dark</h2>
        <p class="lead">Filter by behaviour — passive, aggressive, or leviathan — and learn where each creature lives before you meet it.</p>
      </div>
      <div id="creaturesRoot">
        <div class="toolbar">
          <div class="search">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--text-dim)" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" placeholder="Search creatures, habitats…" />
          </div>
          <button class="chip active" data-filter="__all">All</button>
          <button class="chip" data-filter="tier:titan">Titan</button>
          <button class="chip" data-filter="tier:leviathan">Leviathan</button>
          <button class="chip" data-filter="tier:alpha">Alpha</button>
          <button class="chip" data-filter="tier:predator">Predator</button>
          <button class="chip" data-filter="tier:carnivore">Carnivore</button>
          <button class="chip" data-filter="behavior:passive">Passive</button>
          <button class="chip" data-filter="tier:parasite">Parasite</button>
        </div>
        <div class="cards" id="list"></div>
      </div>
    </div>
  </section>

  <footer class="footer" id="siteFooter"></footer>
  <script src="assets/js/data.js?v=10"></script>
  <script src="assets/js/main.js?v=11"></script>
</body>
</html>
