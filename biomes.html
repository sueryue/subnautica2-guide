<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biomes — Subnautica 2 Guide</title>
  <meta name="description" content="Every biome of Subnautica 2: depth, danger level, resources, and resident creatures." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css?v=11" />
</head>
<body data-page="biomes">
  <header class="nav" id="siteHeader"></header>
  <section class="section">
    <div class="container">
      <div class="section-head">
        <span class="eyebrow">Biomes</span>
        <h2>Chart the ocean floor</h2>
        <p class="lead">From sunlit shallows to molten lava lakes — filter by danger and search to find the right biome for your next run.</p>
      </div>
      <div id="biomesRoot">
        <div class="toolbar">
          <div class="search">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--text-dim)" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" placeholder="Search biomes, resources, creatures…" />
          </div>
          <button class="chip active" data-filter="danger:">All</button>
          <button class="chip" data-filter="danger:safe">Safe</button>
          <button class="chip" data-filter="danger:caution">Caution</button>
          <button class="chip" data-filter="danger:danger">Danger</button>
        </div>
        <div class="cards" id="list"></div>
      </div>
    </div>
  </section>

  <footer class="footer" id="siteFooter"></footer>
  <script src="assets/js/data.js?v=10"></script>
  <script src="assets/js/main.js?v=11"></script>
</body>
</html>
